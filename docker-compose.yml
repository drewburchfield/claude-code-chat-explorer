services:
  chat-explorer:
    build:
      context: .
      args:
        USER_ID: 501
    container_name: claude-code-chat-explorer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9876:9876"  # Localhost only
    volumes:
      # Mount at SAME absolute path so symlinks resolve correctly
      - ${HOME}/.claude:${HOME}/.claude:ro
      # Writable volume for SQLite database
      - chat-explorer-db:/data
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=1024
      # Bind all interfaces INSIDE the container so Docker's port-forwarding
      # (arrives on eth0, not loopback) reaches the app. Safe: the host-side
      # mapping above is 127.0.0.1-only and start-secure.sh blocks egress.
      - CHATS_HOST=0.0.0.0
      - HOME=${HOME}
      - CLAUDE_HOME=${HOME}/.claude
      - CLAUDE_DB_PATH=/data/conversations.db
      # Polling is the only chokidar mode that reliably sees host file
      # events through Docker Desktop's VirtioFS bridge on macOS/Windows.
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=2000

    # Security hardening
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /home/appuser/.npm:size=64m

    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # chat-explorer-test:
  #   build:
  #     context: .
  #     target: test
  #   profiles:
  #     - test
  #   environment:
  #     - NODE_ENV=test
  #   # Tests should not depend on your real ~/.claude data or the prod DB volume
  #   volumes: []

volumes:
  chat-explorer-db:
