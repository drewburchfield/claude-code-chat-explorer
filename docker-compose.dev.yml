# Parallel "dev" container for testing in-progress work without disturbing
# the user's production instance on port 9876. Build, run, and tear down
# with:
#
#   docker compose -f docker-compose.dev.yml -p chat-explorer-dev up -d --build
#   docker compose -f docker-compose.dev.yml -p chat-explorer-dev logs -f
#   docker compose -f docker-compose.dev.yml -p chat-explorer-dev down -v

services:
  chat-explorer-dev:
    build:
      context: .
      args:
        USER_ID: 501
    container_name: claude-code-chat-explorer-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:9877:9876"
    volumes:
      - ${HOME}/.claude:${HOME}/.claude:ro
      - chat-explorer-dev-db:/data
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=1024
      - HOME=${HOME}
      - CLAUDE_HOME=${HOME}/.claude
      - CLAUDE_DB_PATH=/data/conversations.db
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=2000

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /home/appuser/.npm:size=64m

    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  chat-explorer-dev-db:
