name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    # `branches:` here filters on the PR's BASE branch. Without `dev` listed,
    # feature → dev PRs never trigger CI (only the later dev → main PR does).
    # That meant feature work could merge to dev without tests running.
    branches: [main, dev]
  workflow_dispatch:

# Default permissions for every job. Codecov upload only needs read; widen at
# the job level (not workflow level) if a future job needs more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Aikido safe-chain: routes every npm install in this job through
      # Aikido Intel's malware-blocking proxy, transitive deps included.
      # Pinned to 1.5.3 so a future safe-chain regression can't break CI.
      - name: Install safe-chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci
          echo "$HOME/.safe-chain/shims" >> "$GITHUB_PATH"
          echo "$HOME/.safe-chain/bin"   >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install safe-chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci
          echo "$HOME/.safe-chain/shims" >> "$GITHUB_PATH"
          echo "$HOME/.safe-chain/bin"   >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Check for syntax errors
        run: node --check src/chats-mobile.js
