name: Tests

# Both jobs install Aikido safe-chain before `npm ci` so dependency installs
# are checked against Aikido Intel's malware feed. Pinned version is in the
# install step. `npm safe-chain-verify` after install asserts the wrapper is
# actually intercepting npm: if it ever silently falls back to unprotected
# npm (e.g. PATH mis-ordering, shim not on disk), CI fails loudly.
on:
  push:
    branches: [main, dev]
  pull_request:
    # `branches:` on `pull_request` filters the PR's BASE branch. `dev` must
    # be listed for feature -> dev PRs to trigger this workflow.
    branches: [main, dev]
  workflow_dispatch:

# Workflow-wide default. Jobs only need read access; a future job that needs
# more (e.g. release publishing) should opt in at the job level.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # safe-chain version is pinned: a future regression should not silently
      # break the build. Bump deliberately when a known-good newer version exists.
      - name: Install safe-chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci
          echo "$HOME/.safe-chain/shims" >> "$GITHUB_PATH"
          echo "$HOME/.safe-chain/bin"   >> "$GITHUB_PATH"

      # Confirms the npm wrapper is active. Without this, a broken install
      # falls back to unprotected npm and CI still passes (silent bypass).
      - name: Verify safe-chain is wrapping npm
        run: npm safe-chain-verify

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          # Fail the job if upload fails. Codecov outages are rare and a
          # silently-skipped upload means missing coverage data with no
          # signal. Flip back to false if Codecov flakes become routine.
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install safe-chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci
          echo "$HOME/.safe-chain/shims" >> "$GITHUB_PATH"
          echo "$HOME/.safe-chain/bin"   >> "$GITHUB_PATH"

      - name: Verify safe-chain is wrapping npm
        run: npm safe-chain-verify

      - name: Install dependencies
        run: npm ci

      - name: Check for syntax errors
        run: node --check src/chats-mobile.js
